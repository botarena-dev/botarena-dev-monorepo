actions:
  - name: signIn
    definition:
      kind: ""
      handler: '{{ACTION_BASE_URL}}/auth/sign-in'
      headers:
        - name: x-hook-secret
          value_from_env: HOOK_SECRET
    permissions:
      - role: anonymous
  - name: signUp
    definition:
      kind: synchronous
      handler: '{{ACTION_BASE_URL}}/auth/sign-up'
      forward_client_headers: true
      headers:
        - name: x-hook-secret
          value_from_env: HOOK_SECRET
    permissions:
      - role: anonymous
custom_types:
  enums: []
  input_objects:
    - name: SignUpInput
    - name: SignInInput
  objects:
    - name: SignUpOutput
    - name: SignInOutput
  scalars: []
