type Query {
  signIn(
    arg1: SignInInput!
  ): SignInOutput
}

type Mutation {
  signUp(
    arg1: SignUpInput!
  ): SignUpOutput
}

input SignUpInput {
  email: String!
  password: String!
  nickname: String!
}

input SignInInput {
  email: String!
  password: String!
}

type SignUpOutput {
  id: Int!
}

type SignInOutput {
  accessToken: String!
}

